<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问受限 - GroundedDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&family=Noto+Sans+SC:wght@400;500;700&display=swap');

        :root {
            --paper: #f7f7f3;
            --surface: #ffffff;
            --forest-950: #10291e;
            --forest-800: #1a3c2b;
            --forest-100: #dde9e1;
            --ink-900: #202421;
            --ink-600: #626a64;
            --ink-400: #909790;
            --line: rgba(32, 36, 33, 0.14);
            --line-strong: rgba(32, 36, 33, 0.26);
            --warning: #c2613b;
            --background: var(--paper);
            --foreground: var(--ink-900);
            --border: var(--line);
            --radius-card: 12px;
            --radius-control: 8px;
        }

        * {
            box-sizing: border-box;
            border-color: var(--line);
        }

        body {
            margin: 0;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Inter, sans-serif;
            background-color: var(--paper);
            color: var(--ink-900);
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
            font-variant-numeric: tabular-nums;
        }

        .secondary-button {
            height: 40px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-control);
            color: var(--ink-900);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .secondary-button:hover {
            background-color: var(--paper);
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-[#f7f7f3] flex items-center justify-center px-5" data-sd-id="1">
        <main class="max-w-md w-full rounded-[12px] border border-[rgba(32,36,33,0.14)] bg-white p-8" data-sd-id="2">
            <section data-sd-id="3">
                <p class="mono text-[11px] font-semibold text-[#c2613b] leading-[16px] uppercase tracking-[0.04em]" data-sd-id="4">访问受限</p>
                <h1 class="mt-3 text-2xl font-bold text-[#10291e] tracking-tight" data-sd-id="5">此身份不属于演示组织</h1>
                <p class="mt-3 text-sm text-[#626a64] leading-[22px]" data-sd-id="6">
                    Supabase 认证成功不代表拥有后台权限。只有组织管理员成员可以读取组织数据。
                </p>
                <div class="mt-6" data-sd-id="7">
                    <a href="/login" id="back-to-login-btn" class="secondary-button" data-sd-id="8">
                        返回登录
                    </a>
                </div>
            </section>
        </main>
    </div>

</body></html>
